[project]
name = "lightning-mcp"
version = "0.1.0"
description = "MCP server for a Core Lightning node (clnrest), read-only by default with gated payments."
requires-python = ">=3.12"

# Runtime dependencies. The RPC client is stdlib-only on purpose (see
# rpc.py): this server POSTs JSON to one daemon on the podman network, so
# it needs neither a redirect-following client nor a TLS stack, and the
# smaller closure is less to audit. uv.lock pins the full closure with
# hashes; the image installs from a hash-verified export of it.
dependencies = [
    "mcp>=2.3.0",
    # Pulled in transitively by mcp, but server.py imports it directly,
    # so it is declared rather than borrowed.
    "uvicorn>=0.31.1",
]

# Dev-only. uv installs this group by default, which is what makes
# `uv run pytest` work with no venv of your own.
[dependency-groups]
dev = [
    "anyio>=4.5",
    "pytest>=8.3",
    "ruff>=0.6",
    # The nodejs extra bundles Node, so `uv run pyright` works on a
    # machine with no node on PATH.
    "pyright[nodejs]>=1.1.414",
]

# server.py is a script at the repo root, not a package: without this uv
# tries to build a wheel of the project itself and fails.
[tool.uv]
package = false

[tool.pytest.ini_options]
# server.py sits at the repo root and is imported as a top-level module.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["server.py", "rpc.py", "healthcheck.py", "tests", "scripts"]
# The floor from requires-python, not the image's Python: code has to
# typecheck on the oldest Python the manifest allows.
pythonVersion = "3.12"
